# Ref: https://docs.github.com/en/actions/tutorials/create-actions/create-a-composite-action
name: 'GCP Authentication'
description: 'Auth to GCP'
inputs:
  project_id:
    description: 'GCP Project ID'
    required: true
  project_number:
    description: 'GCP Project Number'
    required: true

runs:
  using: 'composite'
  steps:
  - id: auth
    name: Authenticate to Google Cloud using Workload Identity Federation
    uses: google-github-actions/auth@v2
    with:
      workload_identity_provider: 'projects/${{ inputs.project_number }}/locations/global/workloadIdentityPools/github-actions/providers/github'
      service_account: 'github-actions@${{ inputs.project_id }}.iam.gserviceaccount.com'
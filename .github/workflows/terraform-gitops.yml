name: Terraform GitOps Workflow

on:
  push:
    branches:
      - develop # Triggers apply on push to develop
    paths:
      - 'terraform/gcp/dev/**'
  pull_request:
    branches: [develop] # Triggers plan on PRs to develop
    paths:
      - 'terraform/gcp/dev/**'

env:
  terraform_version: 1.14.3 # This is the version of terraform that will be used in the workflow.
  working_directory: terraform/gcp/dev # This is the folder where terraform code lives, and also the folder where terraform commands will be run from.

permissions:
  contents: read
  id-token: write
jobs:
  # Job to run terraform plan
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: dev # This tells GitHub to check environment variables and secrets in the "dev" environment folder
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.working_directory }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using Workload Identity Federation
      - name: GCP Authentication
        uses: ./.github/actions/gcp_auth
        with:
          project_id: ${{ vars.PROJECT_ID }}
          project_number: ${{ vars.PROJECT_NUMBER }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.terraform_version }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -input=false

  # Job to run terraform apply, only on push to develop branch.
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' # Only run on push to develop
    defaults:
      run:
        working-directory: ${{ env.working_directory }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using Workload Identity Federation
      - name: GCP Authentication
        uses: ./.github/actions/gcp_auth
        with:
          project_id: ${{ vars.PROJECT_ID }}
          project_number: ${{ vars.PROJECT_NUMBER }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.terraform_version }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
